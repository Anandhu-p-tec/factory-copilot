<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Factory Copilot</title>
<style>
  :root{
    --bg:#f3f1ec; --card:#fff; --ink:#15181c; --muted:#5a626b; --line:#d6d2c8;
    --brand:#14213d; --hazard:#f2b705;
    --ok:#0b6b3a; --ok-bg:#e3f4ea;
    --warn:#8a4b00; --warn-bg:#fff2d6;
    --bad:#8f1d1d; --bad-bg:#fde8e8;
    --none:#2f3a46; --none-bg:#e8ebef;
  }
  @media (prefers-color-scheme: dark){
    :root{--bg:#101316; --card:#1a1f24; --ink:#f1f3f5; --muted:#a3acb6; --line:#323a42; --brand:#0b1220;
      --ok:#7be0a6; --ok-bg:#12301f; --warn:#ffd277; --warn-bg:#3a2b08; --bad:#ff9f9f; --bad-bg:#3a1515; --none:#d5dbe2; --none-bg:#262d34;}
  }
  *{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%}
  body{margin:0;background:var(--bg);color:var(--ink);font:18px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
       padding-bottom:env(safe-area-inset-bottom)}
  header{background:var(--brand);color:#fff;padding:14px 16px;border-bottom:6px solid var(--hazard);
         display:flex;align-items:center;gap:10px;padding-top:max(14px,env(safe-area-inset-top))}
  header h1{font-size:20px;margin:0;letter-spacing:.3px}
  header small{opacity:.8;display:block;font-size:13px;font-weight:400}
  main{max-width:760px;margin:0 auto;padding:14px 14px 40px}
  label{font-weight:700;display:block;margin:6px 0}
  textarea{width:100%;font:inherit;padding:14px;border:2px solid var(--line);border-radius:12px;background:var(--card);color:var(--ink);
           min-height:96px;resize:vertical}
  textarea:focus,button:focus-visible,summary:focus-visible,a:focus-visible{outline:3px solid var(--hazard);outline-offset:2px}
  .row{display:flex;gap:10px;margin-top:10px}
  button{font:inherit;font-weight:700;border:0;border-radius:12px;min-height:56px;padding:0 18px;cursor:pointer}
  #ask{flex:1;background:var(--brand);color:#fff;font-size:19px}
  #ask:disabled{opacity:.6}
  #clear{background:var(--none-bg);color:var(--ink);min-width:84px}
  .samples{margin:16px 0 6px;color:var(--muted);font-size:15px;font-weight:600}
  .chips{display:flex;flex-direction:column;gap:8px}
  .chip{background:var(--card);color:var(--ink);border:2px solid var(--line);text-align:left;font-weight:500;font-size:16px;
        min-height:52px;padding:10px 14px;line-height:1.3}
  #result{margin-top:18px}
  .banner{border-radius:14px;padding:12px 14px;font-weight:700;display:flex;gap:10px;align-items:center;border:2px solid currentColor;font-size:18px}
  .banner .ic{font-size:24px;line-height:1}
  .s-supported{background:var(--ok-bg);color:var(--ok)}
  .s-partial{background:var(--warn-bg);color:var(--warn)}
  .s-conflict{background:var(--bad-bg);color:var(--bad)}
  .s-none{background:var(--none-bg);color:var(--none)}
  .card{background:var(--card);border:2px solid var(--line);border-radius:14px;padding:14px;margin-top:12px}
  .answer{font-size:20px;white-space:pre-wrap}
  .note{color:var(--muted);font-size:15px;margin-top:8px}
  .alert{border-radius:12px;padding:12px 14px;margin-top:12px;font-weight:600;font-size:16px;border:2px solid currentColor}
  .alert.w{background:var(--warn-bg);color:var(--warn)} .alert.b{background:var(--bad-bg);color:var(--bad)}
  .rules{border-left:8px solid var(--hazard)}
  .rules h3,.src h3{margin:0 0 6px;font-size:16px;text-transform:uppercase;letter-spacing:.5px;color:var(--muted)}
  .rules li{margin:6px 0}
  .rules cite{display:block;color:var(--muted);font-size:14px;font-style:normal}
  h2{font-size:17px;margin:20px 0 4px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px}
  .src{padding:0;overflow:hidden}
  .src summary{list-style:none;cursor:pointer;padding:14px;min-height:56px}
  .src summary::-webkit-details-marker{display:none}
  .src .meta{font-weight:700}
  .src .sub{color:var(--muted);font-size:15px}
  .badge{display:inline-block;border-radius:999px;padding:2px 10px;font-size:13px;font-weight:700;margin-left:6px;vertical-align:1px}
  .b-cur{background:var(--ok-bg);color:var(--ok)} .b-old{background:var(--bad-bg);color:var(--bad)} .b-ref{background:var(--none-bg);color:var(--none)}
  .src .body{padding:0 14px 14px;border-top:1px dashed var(--line)}
  .passage{white-space:pre-wrap;font-size:17px;background:var(--bg);border-radius:10px;padding:12px;margin:12px 0 10px;border-left:6px solid var(--hazard)}
  .src.old .passage{border-left-color:var(--bad);text-decoration:line-through;text-decoration-thickness:1px}
  .open{display:inline-flex;align-items:center;min-height:48px;padding:0 14px;border-radius:10px;background:var(--brand);color:#fff;text-decoration:none;font-weight:700}
  .used{font-size:13px;color:var(--muted)}
  .err{background:var(--bad-bg);color:var(--bad);border:2px solid currentColor;border-radius:12px;padding:12px 14px;font-weight:600}
  .spin{display:inline-block;width:20px;height:20px;border:3px solid #fff5;border-top-color:#fff;border-radius:50%;animation:s .8s linear infinite;vertical-align:-4px;margin-right:8px}
  @keyframes s{to{transform:rotate(360deg)}}
  footer{max-width:760px;margin:0 auto;padding:0 14px 28px;color:var(--muted);font-size:14px}
  .mono{font-variant-numeric:tabular-nums}
</style>
</head>
<body>
<header>
  <div style="font-size:30px" aria-hidden="true">⚙️</div>
  <h1>Factory Copilot<small>Answers from your plant's controlled documents</small></h1>
</header>
<main>
  <label for="q">Ask a question</label>
  <textarea id="q" maxlength="500" placeholder="e.g. Alarm AL-104 is showing — what should the operator do?" enterkeyhint="send"></textarea>
  <div class="row">
    <button id="ask" type="button">Ask</button>
    <button id="clear" type="button" aria-label="Clear question">Clear</button>
  </div>

  <div class="samples">Try a sample question</div>
  <div class="chips" id="chips"></div>

  <div id="result" aria-live="polite"></div>
</main>
<footer>
  This tool only quotes the loaded documents. Printed or downloaded copies may be out of date — the QMS is the controlled source.
  If anything here looks wrong, stop and ask your supervisor.
</footer>

<script>
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const LABEL = {
  supported: ['✅', 'Answer found in the documents'],
  partial:   ['⚠️', 'Partly answered — read the details'],
  conflict:  ['⛔', 'Sources conflict — verify before acting'],
  none:      ['❌', 'Not found in the documents']
};

fetch('/api/samples').then(r => r.json()).then(list => {
  $('chips').innerHTML = list.map((s, i) => `<button class="chip" data-i="${i}">${esc(s)}</button>`).join('');
  $('chips').querySelectorAll('.chip').forEach(b => b.onclick = () => { $('q').value = list[b.dataset.i]; ask(); });
}).catch(() => {});

$('clear').onclick = () => { $('q').value = ''; $('result').innerHTML = ''; $('q').focus(); };
$('ask').onclick = ask;
$('q').addEventListener('keydown', e => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); ask(); } });

async function ask() {
  const q = $('q').value.trim();
  if (!q) { $('q').focus(); return; }
  const btn = $('ask'); btn.disabled = true; btn.innerHTML = '<span class="spin"></span>Searching…';
  try {
    const ctl = new AbortController(); const t = setTimeout(() => ctl.abort(), 45000);
    const res = await fetch('/api/ask', {method: 'POST', headers: {'Content-Type': 'application/json'},
                                          body: JSON.stringify({question: q}), signal: ctl.signal});
    clearTimeout(t);
    if (!res.ok) { const e = await res.json().catch(() => ({})); throw new Error(e.detail || ('Server error ' + res.status)); }
    render(await res.json());
  } catch (e) {
    const offline = e.name === 'AbortError' || e instanceof TypeError;
    $('result').innerHTML = `<div class="err">${offline ? 'Could not reach the Factory Copilot server (timeout or Wi-Fi drop). Your question is still in the box — tap Ask to retry. If it keeps failing, use the paper/QMS procedure.' : esc(e.message)}</div>`;
  } finally { btn.disabled = false; btn.textContent = 'Ask'; }
}

function srcCard(s) {
  const role = s.role;
  const badge = role === 'superseded' ? '<span class="badge b-old">SUPERSEDED — do not use</span>'
              : role === 'closest' ? '<span class="badge b-ref">Reference only</span>'
              : '<span class="badge b-cur">Current</span>';
  const used = role === 'evidence' ? (s.used ? '' : '<span class="used"> · retrieved, not used in answer</span>') : '';
  return `<details class="card src ${role === 'superseded' ? 'old' : ''}" ${role === 'evidence' && s.used && s.n === 1 ? 'open' : ''}>
    <summary><div class="meta">[${s.n}] ${esc(s.doc_no || s.file)} ${esc(s.revision || '')} · page ${s.page} ${badge}</div>
      <div class="sub">${esc(s.section)} · effective ${esc(s.effective || 'n/a')}${used}</div></summary>
    <div class="body"><div class="passage">${esc(s.text)}</div>
      <a class="open" href="/pdf/${encodeURIComponent(s.file)}#page=${s.page}" target="_blank" rel="noopener">Open PDF at page ${s.page}</a></div>
  </details>`;
}

function render(d) {
  const [ic, label] = LABEL[d.status] || LABEL.none;
  let h = `<div class="banner s-${d.status}" role="status"><span class="ic" aria-hidden="true">${ic}</span><span>${label}</span></div>`;
  h += d.warnings.map(w => `<div class="alert b">⚠ ${esc(w)}</div>`).join('');
  h += `<div class="card"><div class="answer">${esc(d.answer)}</div>`;
  if (d.missing) h += `<div class="alert w">Not stated in the documents: ${esc(d.missing)}</div>`;
  h += d.notes.map(n => `<div class="note">${esc(n)}</div>`).join('');
  h += `<div class="note mono">${d.answer_mode === 'llm' ? 'AI-written summary of the cited passages' : d.answer_mode === 'extractive' ? 'Text taken directly from the document' : ''}${d.latency_ms ? ' · ' + (d.latency_ms/1000).toFixed(2) + ' s' : ''}</div></div>`;
  if (d.rules.length) {
    h += `<div class="card rules"><h3>Rules stated in the source text</h3><ul>` +
      d.rules.map(r => `<li>“${esc(r.text)}”<cite>${esc(r.doc_no)} ${esc(r.revision)} · page ${r.page}</cite></li>`).join('') + `</ul></div>`;
  }
  const ev = d.sources.filter(s => s.role === 'evidence'), old = d.sources.filter(s => s.role === 'superseded'), cl = d.sources.filter(s => s.role === 'closest');
  if (ev.length) h += `<h2>Sources — check the original</h2>` + ev.map(srcCard).join('');
  if (old.length) h += `<h2>Older revision (for comparison only)</h2>` + old.map(srcCard).join('');
  if (cl.length) h += `<h2>Closest text (does not answer the question)</h2>` + cl.map(srcCard).join('');
  h += `<div class="row"><button id="again" type="button" class="chip" style="flex:1;text-align:center">Ask a follow-up question</button></div>`;
  $('result').innerHTML = h;
  $('again').onclick = () => { $('q').focus(); $('q').select(); window.scrollTo({top: 0, behavior: 'smooth'}); };
  $('result').scrollIntoView({behavior: 'smooth', block: 'start'});
}
</script>
</body>
</html>
